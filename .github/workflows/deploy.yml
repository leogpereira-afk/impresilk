name: Deploy (GitHub Pages)

# Publica o PCP / Instalacao no GitHub Pages. O backend e o Supabase (Edge
# Functions pcp-sync / pcp-mubisys), chamado direto pelo navegador.
#
# App vanilla, sem build: o passo abaixo so separa o que e SITE do que e
# ferramenta de repositorio (netlify/, supabase/, scripts/, guias), para nao
# publicar codigo de servidor junto com a pagina.
#
# Nao precisa de 404.html: o app e multipagina (index.html + equipe.html), os
# arquivos existem de verdade -- diferente de uma SPA.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar regras, telas e sincronização
        run: npm run verificar

      - name: Separar os arquivos do site
        run: |
          mkdir -p dist
          cp index.html equipe.html styles.css config.js logo.js frases.js \
            store.js auth.js operacao.js app.js equipe.js manifest.json \
            icon.svg favicon.svg sw.js dist/

      # Sem "enablement": o token do Actions publica no Pages mas nao pode
      # CRIA-lo ("Resource not accessible by integration"). O site e habilitado
      # uma vez pela API.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
