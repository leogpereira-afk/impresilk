name: Deploy (GitHub Pages)

# Publica o PCP / Instalacao no GitHub Pages. O backend e o Supabase (Edge
# Functions pcp-sync / pcp-mubisys), chamado direto pelo navegador.
#
# App vanilla, sem build: o passo abaixo so separa o que e SITE do que e
# ferramenta de repositorio (supabase/, scripts/, guias), para nao
# publicar codigo de servidor junto com a pagina.
#
# Nao precisa de 404.html: o app e multipagina (index.html + equipe.html), os
# arquivos existem de verdade -- diferente de uma SPA.
on:
  push:
    branches: [main]
    # Pegar ou passar a vez (so o VEZ.md e o arquivo da passagem) nao republica o site.
    paths-ignore:
      - 'VEZ.md'
      - 'docs/passagens/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  # Ler o ultimo Deploy verde: e dele que parte a conferencia da vez.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia inteira: a conferencia da vez olha CADA commit do push.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar regras, telas e sincronização
        run: npm run verificar

      # Um agente por repositorio de cada vez (AGENTS.md, secao 5). Cada commit
      # leva "Agente: X" e X e quem tem a vez no VEZ.md daquele commit.
      # Em 02-08/10/2026 entraram 39 commits na main sem dizer de quem eram.
      #
      # BASE = o ULTIMO DEPLOY VERDE da main, nao o "before" do push. Com o
      # before, o push que o paths-ignore pula (so VEZ.md) nunca era conferido,
      # nem o merge que tomava a vez; e o commit recusado saia da faixa no push
      # seguinte e ia ao ar junto com ele. Agora tudo desde o ultimo verde e
      # conferido de novo, e o recusado continua vermelho ate o dono aceita-lo.
      # O CONFERIDOR vem da base: mexer no vez.cjs no proprio push nao o desliga.
      # A CHAVE do GitHub: commit do dono pelo site (editor ou botao de merge) vem
      # assinado por ela e vale como "Agente: leo" sem a linha.
      - name: Commits dentro da vez?
        env:
          ANTES: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! verde=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""'); then
            echo "::error::Nao consegui ler o ultimo Deploy verde pela API do GitHub. Sem ele nao sei o que conferir: rode de novo."
            exit 1
          fi
          if [ -n "$verde" ] && git cat-file -e "${verde}^{commit}" 2>/dev/null; then
            base="$verde"
          elif [ -n "$ANTES" ] && git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            base="$ANTES"; echo "::warning::Nenhum Deploy verde na historia desta main: confiro so este push."
          else
            base=$(git rev-parse HEAD~1); echo "::warning::Nenhum Deploy verde nem before: confiro so o ultimo commit."
          fi
          echo "base da conferencia: $base (ultimo Deploy verde: ${verde:-nenhum})"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          curl -fsSL https://github.com/web-flow.gpg | gpg --batch --quiet --import || echo "::warning::Nao importei a chave do GitHub: commit do dono feito pelo site, sem a linha Agente, vai ficar vermelho."
          if git cat-file -e "$base:scripts/vez.cjs" 2>/dev/null; then
            git show "$base:scripts/vez.cjs" > "$RUNNER_TEMP/vez.cjs"
          else
            cp scripts/vez.cjs "$RUNNER_TEMP/vez.cjs"
          fi
          PCP_RAIZ="$GITHUB_WORKSPACE" node "$RUNNER_TEMP/vez.cjs" conferir "$base..HEAD"

      - name: Versao igual nos 83 lugares?
        run: node scripts/subir-versao.cjs

      # POR GLOB, NAO POR LISTA. A lista nominal deixou o casa.js de fora quando
      # ele nasceu (13/09/2026): o site subiu com index.html pedindo um arquivo
      # que o Pages respondia com 404, e Entregas, Performance, Calendario,
      # Plantoes e Programacao abriram VAZIOS por dias sem ninguem perceber --
      # o app engole a funcao ausente em silencio. Tudo que e site mora na raiz;
      # o que nao e (supabase/, scripts/, tests/, guias) fica fora
      # porque nao esta na raiz ou nao tem essas extensoes.
      - name: Separar os arquivos do site
        run: |
          mkdir -p dist
          cp *.html *.css *.js manifest.json *.svg dist/
          # Logos das equipes (29/09/2026): imagem do site, na raiz, na casca do sw.js.
          cp *.webp dist/
          rm -f dist/*.config.js dist/*.test.js
          echo "publicando:"; ls dist
          for f in index.html equipe.html app.js casa.js performance.js operacao.js store.js sw.js divisao.js; do
            test -f "dist/$f" || { echo "FALTA $f no site"; exit 1; }
          done
          # Todo arquivo que o sw.js guarda para o offline tem de estar no site:
          # um que falte faz o install do service worker abortar em todo aparelho.
          for f in $(grep -o "'[a-z0-9.-]*\.\(js\|css\|webp\|svg\|json\|html\)[?']" sw.js | tr -d "'?" | sort -u); do
            test -f "dist/$f" || { echo "FALTA $f (listado no sw.js)"; exit 1; }
          done

      # Sem "enablement": o token do Actions publica no Pages mas nao pode
      # CRIA-lo ("Resource not accessible by integration"). O site e habilitado
      # uma vez pela API.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
