<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1877f2">
  <title>🔧 PCP · Instalação</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Impresilk">
  <link rel="stylesheet" href="styles.css?v=v73">
</head>
<body>

  <!-- ── Login ─────────────────────────────────────────────────────────── -->
  <div id="login-screen" class="login-wrap">
    <div class="login-card">
      <img class="login-logo" id="login-logo" alt="Impresilk">
      <h2>Impresilk</h2>
      <p class="subtitle">Controle de Instalação</p>

      <!-- Passo 1: escolher a área -->
      <div id="login-choose" class="login-choose">
        <button class="login-big-btn lb-gestao" id="choose-gestao">
          <span class="lb-ico">🏢</span>
          <span class="lb-txt"><strong>Gestão</strong><small>Administradores</small></span>
        </button>
        <button class="login-big-btn lb-montagem" id="choose-montagem">
          <span class="lb-ico">🔧</span>
          <span class="lb-txt"><strong>Montagem</strong><small>Equipe de instalação</small></span>
        </button>
      </div>

      <!-- Passo 2a: login da gestão -->
      <div id="login-gestao" class="hidden">
        <div class="field">
          <label for="login-user">Usuário</label>
          <input type="text" id="login-user" placeholder="primeiro nome, minúsculo" autocomplete="username" autocapitalize="none">
        </div>
        <div class="field mt-12">
          <label for="login-pass">Senha</label>
          <input type="password" id="login-pass" placeholder="sua senha" autocomplete="current-password">
        </div>
        <button class="btn-primary w-100 mt-12" id="login-btn">Entrar</button>
        <div id="login-error" class="login-error hidden"></div>
        <button class="login-link" id="login-esqueci">Esqueci minha senha</button>
        <button class="login-voltar" data-login-voltar>← Voltar</button>
      </div>

      <!-- Passo 2b: escolher o nome do funcionário -->
      <div id="login-montagem" class="hidden">
        <p class="login-montagem-hint">Toque no seu nome:</p>
        <div id="montagem-nomes" class="montagem-nomes"></div>
        <button class="login-voltar" data-login-voltar>← Voltar</button>
      </div>
    </div>
  </div>

  <!-- ── App ───────────────────────────────────────────────────────────── -->
  <div id="app" class="hidden">

    <!-- Topbar -->
    <header class="topbar">
      <img class="logo-img" id="topbar-logo" alt="Impresilk">
      <div class="topbar-user">
        <span id="user-badge"></span>
        <span id="topbar-date" class="topbar-date"></span>
      </div>
      <div class="topbar-actions">
        <button class="btn-ghost btn-sm" id="btn-menu" aria-label="Abrir menu" title="Menu">☰</button>
        <button class="btn-ghost btn-sm admin-only" id="btn-espelhos" title="Espelhos somente-leitura para instaladores e comercial">🪞 Espelhos</button>
        <button class="btn-ghost btn-sm edit-only" id="btn-import-pdf" title="Importar O.S a partir do PDF do ERP">📄 Importar PDF</button>
        <button class="btn-primary btn-sm edit-only" id="btn-nova-os">+ Nova O.S</button>
        <button class="btn-ghost btn-sm" id="btn-instrucoes" title="Como usar o sistema">❔ Instruções</button>
        <button class="btn-ghost btn-sm" id="btn-verificar" title="Conferir no servidor se as O.S foram salvas na nuvem">☁️ Verificar</button>
        <span id="sync-indicator" class="sync-indicator ok" title="Status de sincronização">✅</span>
        <button class="btn-ghost btn-sm" id="btn-senha" title="Trocar a minha senha">🔑</button>
        <button class="btn-ghost btn-sm" id="btn-logout" title="Sair">⏻</button>
      </div>
    </header>

    <!-- Frase motivacional -->
    <div id="frase-bar" class="frase-bar"></div>

    <div id="nav-fundo" class="nav-fundo" hidden></div>
    <div class="app-body">
    <!-- Tabs laterais -->
    <nav class="tabs" id="tabs" aria-label="Produção Impresilk">
      <div class="nav-marca">
        <img class="nav-logo" id="nav-logo" alt="">
        <span>Impresilk</span>
      </div>
      <p class="nav-grupo">Operação</p>
      <button class="tab active" data-tab="pcp"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 3v2h6V3M8 10h8M8 14h6"/></svg> PCP</button>
      <button class="tab" data-tab="programacao"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h13l5 5v6H3z"/><path d="M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg> Instalação</button>
      <button class="tab" data-tab="execucao"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 14h7l-1 7 8-11h-7z"/></svg> Execução</button>
      <button class="tab" data-tab="retrabalho"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a5 5 0 0 1 3 8.2L12 20.2 6.3 14.5a5 5 0 0 1 8.4-8.2z"/><path d="M8 11h.01"/></svg> Retrabalho</button>
      <button class="tab" data-tab="finalizados"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h9l1 3h9v10H14l-1-3H5"/></svg> Finalizados</button>
      <p class="nav-grupo">Entrega</p>
      <button class="tab" data-tab="entregas"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 9.4 7.5 4.2 3 6.7v10.6l4.5 2.5 9-5.2V9.4z"/><path d="M12 12v7.6M21 8.2v7.6l-4.5 2.5"/></svg> Entregas</button>
      <button class="tab" data-tab="performance"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M8.2 13 7 21l5-3 5 3-1.2-8"/></svg> Performance</button>
      <p class="nav-grupo">Agenda</p>
      <button class="tab" data-tab="agenda"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg> Calendário</button>
      <button class="tab" data-tab="plantoes"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg> Plantões</button>
      <button class="tab" data-tab="grade"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M6 10.5V20h12v-9.5"/></svg> Programação</button>
      <p class="nav-grupo">Casa</p>
      <button class="tab" data-tab="painel"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg> Painel</button>
      <button class="tab" data-tab="controle"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg> Configurações</button>
    </nav>

    <!-- Panels -->
    <main>
      <section class="tab-panel" data-panel="painel" id="panel-painel"></section>
      <section class="tab-panel active" data-panel="pcp" id="panel-pcp"></section>
      <section class="tab-panel" data-panel="programacao" id="panel-programacao"></section>
      <section class="tab-panel" data-panel="execucao" id="panel-execucao"></section>
      <section class="tab-panel" data-panel="retrabalho" id="panel-retrabalho"></section>
      <section class="tab-panel" data-panel="finalizados" id="panel-finalizados"></section>
      <section class="tab-panel" data-panel="entregas" id="panel-entregas"></section>
      <section class="tab-panel" data-panel="performance" id="panel-performance"></section>
      <section class="tab-panel" data-panel="agenda" id="panel-agenda"></section>
      <section class="tab-panel" data-panel="plantoes" id="panel-plantoes"></section>
      <section class="tab-panel" data-panel="grade" id="panel-grade"></section>
      <section class="tab-panel" data-panel="controle" id="panel-controle"></section>
    </main>
    </div>
  </div>

  <!-- Modal da O.S -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-os"></div>
  </div>

  <!-- Pop-up de múltipla escolha (ferramentas, equipe, etc.) -->
  <div id="picker-overlay" class="picker-overlay hidden">
    <div class="picker-box">
      <div class="picker-head">
        <h3 id="picker-title">Selecionar</h3>
        <button class="modal-close" id="picker-close">×</button>
      </div>
      <div class="picker-list" id="picker-list"></div>
      <div class="picker-add">
        <input id="picker-novo" placeholder="+ adicionar novo">
        <button class="btn-ghost btn-sm" id="picker-add-btn">Adicionar</button>
      </div>
      <button class="btn-primary w-100 mt-12" id="picker-ok">Confirmar</button>
    </div>
  </div>

  <!-- Conflito -->
  <div id="conflict-dialog" class="conflict-dialog hidden">
    <div class="conflict-box">
      <h3>⚠️ Conflito de edição</h3>
      <p id="conflict-msg">Esta O.S foi alterada em outro aparelho.</p>
      <div class="conflict-actions">
        <button class="btn-primary" id="conflict-reload">Recarregar (servidor)</button>
        <button class="btn-danger" id="conflict-overwrite">Sobrescrever (meu)</button>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast-container"></div>

  <!-- Celebração -->
  <div id="celebra-overlay" class="celebra-overlay hidden">
    <div class="celebra-box" id="celebra-box"></div>
  </div>

  <!-- pdf.js NAO entra aqui. Sao 87 kB de CDN externa que TODO mundo baixava
       so para abrir a lista de O.S, e a biblioteca serve a uma unica coisa:
       importar O.S a partir do PDF do ERP. Passou a ser carregada na hora em
       que alguem clica em "Importar PDF" -- ver garantirPdfJs() no app.js. -->

  <script src="config.js?v=v73"></script>
  <script src="logo.js?v=v73"></script>
  <script src="frases.js?v=v73"></script>
  <script src="store.js?v=v73"></script>
  <script src="auth.js?v=v73"></script>
  <script src="operacao.js?v=v73"></script>
  <script src="app.js?v=v73"></script>
  <script src="casa.js?v=v73"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
